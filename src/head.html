<title>망도노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen field tool — thin top bar of controls, drawing fills the rest, quantity list slides in from the right. */
:root{
  --paper:#f3f4f2; --chrome:#ffffff; --ink:#1b2430; --muted:#5d6876; --line:#d6dad9;
  --accent:#d3202a; --accent-ink:#ffffff; --soft:#e8ebea; --focus:#2a6fdb;
  --st-new:#d3202a; --st-old:#1f5fd1; --st-rep:#11875a;
  --f-ui:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --shadow:0 6px 24px rgba(20,30,40,.18);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15191e; --chrome:#1e242b; --ink:#e7ebee; --muted:#9aa5b1; --line:#333c46;
  --accent:#ff4a52; --accent-ink:#ffffff; --soft:#29313a; --focus:#6aa2ff; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#15191e; --chrome:#1e242b; --ink:#e7ebee; --muted:#9aa5b1; --line:#333c46;
  --accent:#ff4a52; --accent-ink:#ffffff; --soft:#29313a; --focus:#6aa2ff; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark }
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{height:100%;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

/* top bar */
#bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--chrome);border-bottom:1px solid var(--line);
  padding-block:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.brand{font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:6px;margin-right:4px;white-space:nowrap}
.brand i{display:inline-block;width:10px;height:10px;background:var(--accent);transform:rotate(45deg)}
.grp{display:flex;align-items:center;gap:2px;background:var(--soft);border-radius:8px;padding:2px}
.btn{border:0;background:transparent;border-radius:6px;min-height:36px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:rgba(127,127,127,.12)}
.btn.on{background:var(--ink);color:var(--chrome)}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn svg{width:18px;height:18px;flex:none}
.btn:disabled{opacity:.4}
.pg{display:flex;align-items:center;gap:2px}
#pgIn{width:56px;text-align:center;border:1px solid var(--line);border-radius:6px;min-height:32px;background:var(--chrome);font-family:var(--f-num)}
#pgCnt{font-family:var(--f-num);color:var(--muted);min-width:44px}
#lblIn{min-width:0;flex:1 1 140px;max-width:260px;border:1px solid var(--line);border-radius:6px;min-height:34px;padding:0 8px;background:var(--chrome)}
.sp{flex:1 1 0}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--chrome);box-shadow:0 0 0 1px var(--line)}
.btn.on .dot{box-shadow:0 0 0 2px var(--chrome)}
#armed{display:none;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:4px 6px 4px 12px;font-weight:600}
#armed.show{display:flex}
#armed button{border:0;background:rgba(255,255,255,.25);color:inherit;border-radius:999px;width:26px;height:26px}

/* main */
#main{flex:1 1 0;display:flex;min-height:0;position:relative}
#viewer{flex:1 1 0;position:relative;overflow:hidden;touch-action:none;background:
  repeating-linear-gradient(0deg,transparent 0 23px,rgba(127,127,127,.07) 23px 24px),
  repeating-linear-gradient(90deg,transparent 0 23px,rgba(127,127,127,.07) 23px 24px),var(--paper)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18)}
#stage canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#ov{position:absolute;left:0;top:0;overflow:visible}
#ov text{font-family:"IBM Plex Sans KR","Noto Sans KR",sans-serif}
#banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--chrome);border:1px solid var(--line);border-radius:8px;
  padding:6px 12px;box-shadow:var(--shadow);font-size:13px;max-width:calc(100% - 32px);text-align:center;z-index:3}
#banner b{color:var(--accent)}
#scaleTag{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:10px;background:var(--chrome);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;color:var(--muted);font-family:var(--f-num)}
#busy{position:absolute;right:12px;bottom:10px;font-size:12px;color:var(--muted)}

/* side panel */
#panel{width:340px;max-width:92vw;background:var(--chrome);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#panel[hidden]{display:none!important}
@media (max-width:820px){#panel{position:absolute;right:0;top:0;bottom:0;z-index:5;box-shadow:var(--shadow)}}
.ph{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.ph h3{margin:0;font-size:15px;flex:1}
.seg{display:flex;background:var(--soft);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:5px 10px}
.seg button.on{background:var(--chrome);box-shadow:0 1px 2px rgba(0,0,0,.15);font-weight:600}
#sum{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto auto;gap:3px 10px;font-size:13px}
#sum .h{color:var(--muted);font-size:11px;letter-spacing:.04em}
#sum .n{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
#list{overflow:auto;flex:1 1 0;min-height:0}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.row:hover{background:var(--soft)}
.row.sel{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.row .no{font-family:var(--f-num);color:var(--muted);font-size:12px}
.row .nm{min-width:0}
.row .nm b{font-weight:600}
.row .nm small{display:block;color:var(--muted);font-family:var(--f-num)}
.pill{font-size:11px;border-radius:999px;padding:2px 8px;color:#fff;font-weight:600}
.pgh{position:sticky;top:0;background:var(--soft);padding:5px 12px;font-size:12px;color:var(--muted);font-weight:600;cursor:pointer}
.empty{padding:24px 16px;color:var(--muted);line-height:1.6}

/* popups */
.pop{position:fixed;z-index:20;background:var(--chrome);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
#dmenu{width:250px;max-height:70vh;overflow:auto;padding:4px}
#dmenu .mh{font-size:11px;color:var(--muted);padding:6px 10px 4px;letter-spacing:.04em}
#dmenu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:7px;font-size:15px}
#dmenu button:hover,#dmenu button.kb{background:var(--soft)}
#dmenu .k{font-family:var(--f-num);color:var(--muted);width:18px;font-size:12px}
#dmenu svg{width:30px;height:20px;flex:none;border:1px solid var(--line);border-radius:3px;background:#fff}

#qty{left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));padding:12px}
.qh{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.qh h4{margin:0;font-size:16px;flex:1;min-width:120px}
.st{display:flex;gap:4px}
.st button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-weight:600}
.st button.on{color:#fff;border-color:transparent}
.fields{display:flex;gap:8px;margin-bottom:8px}
.fld{flex:1;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;min-width:0}
.fld.on{border-color:var(--focus);box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 25%,transparent)}
.fld small{display:block;color:var(--muted);font-size:11px}
.fld span{font-family:var(--f-num);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.fld span:empty::after{content:"–";color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips button{border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:6px 10px;font-family:var(--f-num)}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pad button{min-height:46px;border:1px solid var(--line);background:var(--chrome);border-radius:8px;font-size:20px;font-family:var(--f-num)}
.pad button:active{background:var(--soft)}
.pad .ok{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-family:var(--f-ui);font-size:17px;font-weight:700}
.pad .cx{font-family:var(--f-ui);font-size:15px}
.prev{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.prev b{color:var(--ink);font-size:16px}

#selbar{left:50%;transform:translateX(-50%);top:62px;display:flex;gap:4px;padding:4px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--chrome);padding:8px 14px;border-radius:8px;z-index:30;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
#toast.show{opacity:1}

.modal{position:fixed;inset:0;z-index:25;background:rgba(10,15,20,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--chrome);border-radius:12px;box-shadow:var(--shadow);width:min(760px,100%);max-height:calc(100% - 16px);display:flex;flex-direction:column}
.mbox header{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.mbox header h3{margin:0;flex:1;font-size:17px}
.mbody{overflow:auto;padding:14px 16px;-webkit-user-select:text;user-select:text}
.mbody h4{margin:16px 0 8px;font-size:14px}
.mbody h4:first-child{margin-top:0}
.lt{width:100%;border-collapse:collapse;font-size:13px}
.lt th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:4px}
.lt td{padding:3px 4px;border-top:1px solid var(--line)}
.lt input,.lt select,.opt input,.opt select{border:1px solid var(--line);border-radius:6px;min-height:32px;padding:0 6px;background:var(--chrome);width:100%}
.lt td.sw svg{width:34px;height:22px;border:1px solid var(--line);border-radius:3px;background:#fff;display:block}
.lt .mini{border:1px solid var(--line);background:var(--soft);border-radius:6px;min-width:30px;min-height:30px}
.tw{overflow-x:auto}
.opt{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.opt label.ck{flex-direction:row;align-items:center;color:var(--ink);font-size:14px}
.opt label.ck input{width:auto;min-height:0}
.exl{display:grid;gap:8px}
.exl button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--chrome);border-radius:10px;padding:12px 14px}
.exl button:hover{background:var(--soft)}
.exl b{font-size:15px}
.exl small{color:var(--muted)}
.help{color:var(--muted);line-height:1.65;font-size:13px}
.help kbd{font-family:var(--f-num);background:var(--soft);border-radius:4px;padding:0 5px}
#resume button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--chrome);border-radius:8px;padding:10px 12px;margin-bottom:6px}
#resume small{color:var(--muted);font-family:var(--f-num)}
@media (max-width:1400px){ .hide-m{display:none} #lblIn{max-width:150px;flex-basis:110px} .btn{padding:0 7px} #inkCols .btn{padding:0 3px!important} #bar{gap:4px} }
@media (max-width:1320px){ [data-tool] .hide-s{display:none} }
@media (max-width:600px){ .hide-s{display:none} #lblIn{flex-basis:100%;max-width:none;order:9} }
.sec{position:sticky;top:0;z-index:1;background:var(--chrome);padding:8px 12px 6px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.row .yr{font-family:var(--f-num);font-size:11px;color:var(--muted);margin-right:4px}
.pill.ghost{background:transparent!important;border:1.5px solid currentColor}
#selbar .btn.on{color:#fff}
#selbar .lbl{align-self:center;padding:0 8px;font-weight:600;font-size:13px;white-space:nowrap}
.yrrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:12px;color:var(--muted)}
.yrrow b{font-family:var(--f-num);color:var(--ink);font-size:14px}
#dmenu .mh{display:flex;justify-content:space-between}
#dmenu .mh em{font-style:normal;font-family:var(--f-num)}
#dmenu .kseg{display:flex;gap:6px;padding:2px 8px 6px}
#dmenu .kseg button{justify-content:center;border:1px solid var(--line);padding:8px 0;font-weight:600}
#dmenu .kseg button.on,#dmenu button.on{background:var(--ink);color:var(--chrome)}
#dmenu .mhelp{font-size:12px;color:var(--muted);padding:4px 10px 8px;margin:0}
#dmenu .memh{align-items:center;background:var(--soft);border-radius:7px;margin:2px 2px 4px;color:var(--ink);font-size:12.5px}
#dmenu .memh button{width:auto;padding:4px 10px;font-size:12px;border:1px solid var(--line);background:#fff}
#dmenu .memt{padding:0 2px 4px}
#dmenu .memt button{padding:5px 8px;font-size:12.5px;color:var(--muted)}
#dmenu button[data-newdmg]{color:var(--accent);font-weight:600}
.grd{display:flex;flex-direction:column;gap:3px;margin:4px 0 6px}
.grd small{color:var(--muted);font-size:11.5px;padding:0 2px}
.grd button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 9px;font-size:13px}
.grd button b{display:inline-block;width:16px;font-family:var(--f-num)}
.grd button.on{background:var(--ink);color:var(--chrome)}
.ktabs{display:flex;gap:6px;margin:0 0 12px}
.ktabs button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 14px;font-size:14px}
.ktabs button svg{width:22px;height:14px}
.ktabs button em{font-style:normal;color:var(--muted);font-family:var(--f-num);font-size:12px}
.ktabs button.on{background:var(--ink);color:var(--chrome);border-color:var(--ink)}
.ktabs button.on em{color:inherit;opacity:.75}
#tmU .btn.on{background:var(--ink);color:var(--chrome)}
/* ---- app lock ---- */
#lock{position:fixed;inset:0;z-index:100;background:var(--paper);display:flex;align-items:center;justify-content:center;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#lock[hidden]{display:none!important}
.lbox{width:min(360px,100%);background:var(--chrome);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:24px 22px;display:flex;flex-direction:column;gap:10px}
.lbox .brand{font-size:20px;margin-bottom:6px}
.lbox input{font-size:20px!important;letter-spacing:.15em}
/* ---- page thumbnails ---- */
#thumbs{width:132px;flex:none;background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#app.home #thumbs{display:none!important}
#thList{overflow-y:auto;flex:1 1 0;min-height:0;padding:10px 12px 40px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain;touch-action:pan-y}
.th{border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:stretch;gap:3px;position:relative;cursor:pointer;flex:none}
.th .tb{display:block;width:100%;background:#fff;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.th .tb img{display:block;width:100%;height:100%;object-fit:contain}
.th.on .tb{outline:2.5px solid var(--accent);outline-offset:1px}
.th .tn{font-family:var(--f-num);font-size:11px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.th.on .tn{color:var(--accent);font-weight:700}
.th .td{position:absolute;top:4px;right:4px;background:var(--accent);color:#fff;font-size:10px;line-height:1.4;border-radius:999px;padding:0 6px;font-weight:700;font-family:var(--f-num)}
@media (max-width:700px){#thumbs{width:96px}#thList{padding:8px}}
/* ---- home: 용역 폴더 → 구조물 ---- */
#app.home .w{display:none!important}
#app.home .brand .hide-m{display:inline!important}
#app.home #viewer,#app.home #panel{display:none!important}
#app:not(.home) #home{display:none}
#bHome{max-width:220px;gap:4px;padding-left:4px}
#bHome .cur{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1;min-width:0;text-align:left}
#bHome .cur small{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
#bHome .cur b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
#home{flex:1 1 0;display:flex;min-height:0;background:var(--paper)}
.hf{width:270px;flex:none;background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.hfh{display:flex;align-items:center;justify-content:space-between;padding:12px 10px 8px 16px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.hfh .btn{font-size:13px;color:var(--ink);border:1px solid var(--line);min-height:32px}
#fList{overflow:auto;flex:1 1 0;padding:2px 8px 8px}
.fi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:10px 10px;border-radius:8px;font-size:15px}
.fi:hover{background:var(--soft)}
.fi.on{background:var(--ink);color:var(--chrome)}
.fi.on .fc{color:inherit;opacity:.75}
.fi svg{width:20px;height:20px;flex:none}
.fi .fn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi .fc{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.fdiv{height:1px;background:var(--line);margin:6px 6px}
#hStore{padding:10px 16px 14px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);line-height:1.5}
#hStore .meter{height:4px;border-radius:2px;background:var(--soft);overflow:hidden;margin-top:4px}
#hStore .meter i{display:block;height:100%;background:var(--ink)}
.hm{flex:1 1 0;min-width:0;display:flex;flex-direction:column;min-height:0}
.hmh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:16px 12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.hmt{flex:1 1 200px;min-width:0}
.hmt small{display:block;font-size:12px;color:var(--muted)}
.hmt h2{margin:0;font-size:22px;letter-spacing:-.01em;text-wrap:balance}
#hSearch{flex:0 1 240px;min-width:0;border:1px solid var(--line);border-radius:8px;min-height:38px;padding:0 10px;background:var(--chrome)}
#hBody{overflow:auto;flex:1 1 0;padding-block:0 24px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.hsec{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:8px 0 8px;display:flex;justify-content:space-between;align-items:center}
.hsec .btn{font-size:12px;font-weight:500;min-height:28px;color:var(--ink)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:20px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--chrome);border-radius:10px;padding:12px 12px 10px;min-width:0;cursor:pointer}
.card:hover{border-color:var(--ink)}
.card:focus-visible{outline:2px solid var(--focus)}
.card .ct{display:flex;align-items:center;gap:8px}
.card .kind{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.card .kind svg{width:26px;height:16px}
.card .more{margin-left:auto;border:0;background:transparent;border-radius:6px;width:32px;height:28px;font-size:18px;line-height:1;color:var(--muted)}
.card .more:hover{background:var(--soft);color:var(--ink)}
.card .cn{font-size:17px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.card .cf{font-size:12px;color:var(--muted);font-family:var(--f-num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cs{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;border-top:1px dashed var(--line);padding-top:7px;margin-top:2px;font-variant-numeric:tabular-nums}
.card .cs b{color:var(--accent)}
.card .cs .t{margin-left:auto;color:var(--muted);font-family:var(--f-num)}
.card .fol{font-size:11px;color:var(--muted)}
.hempty{border:1.5px dashed var(--line);border-radius:12px;padding:28px 24px;max-width:620px;line-height:1.7;color:var(--muted)}
.hempty h3{margin:0 0 6px;color:var(--ink);font-size:17px}
.hempty ol{margin:8px 0 14px;padding-left:20px;color:var(--ink)}
.hempty .btns{display:flex;gap:8px;flex-wrap:wrap}
.hempty .btns .btn{border:1px solid var(--line)}
#cmenu{min-width:200px;padding:4px}
#cmenu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:7px;font-size:14px}
#cmenu button:hover{background:var(--soft)}
#cmenu button.dz{color:var(--accent)}
.fld2{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);margin-bottom:12px}
.fld2 input,.fld2 select{border:1px solid var(--line);border-radius:8px;min-height:40px;padding:0 10px;background:var(--chrome);font-size:15px;color:var(--ink)}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.mact .btn{border:1px solid var(--line);min-height:40px;padding:0 16px}
.mact .btn.primary{border-color:transparent}
.mact .btn.danger{background:var(--accent);color:#fff;border-color:transparent}
@media (max-width:760px){#home{flex-direction:column}.hf{width:auto;max-height:38%;border-right:0;border-bottom:1px solid var(--line)}#hStore{display:none}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
